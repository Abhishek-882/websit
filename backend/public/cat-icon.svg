<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="#080c16" stroke="url(#radarGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="22" fill="url(#centerGlow)"/>
  <!-- Concentric Radar Rings -->
  <circle cx="32" cy="32" r="22" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="16" stroke="#334155" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="9" stroke="url(#radarGrad)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="32" cy="32" r="3" fill="#22d3ee"/>
  <!-- Crosshairs -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Radar Sweep Beam -->
  <path d="M32 32 L49 15 A24 24 0 0 0 32 8 Z" fill="url(#radarGrad)" fill-opacity="0.25"/>
  <line x1="32" y1="32" x2="49" y2="15" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <!-- Detected Blip Targets -->
  <circle cx="44" cy="22" r="2" fill="#10b981"/>
  <circle cx="22" cy="38" r="1.5" fill="#a855f7"/>
