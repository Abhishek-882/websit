services:
  - type: web
    name: websit-solana-radar
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix backend
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: "--no-deprecation"
