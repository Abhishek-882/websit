<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" stroke="url(#catGrad)" stroke-width="2"/>
  <!-- Cat Ears -->
  <polygon points="16,28 22,12 30,22" fill="url(#catGrad)"/>
  <polygon points="48,28 42,12 34,22" fill="url(#catGrad)"/>
  <polygon points="19,25 23,16 28,22" fill="#ec4899"/>
  <polygon points="45,25 41,16 36,22" fill="#ec4899"/>
  <!-- Cat Head -->
  <path d="M16,28 C16,22 48,22 48,28 C52,38 48,50 32,50 C16,50 12,38 16,28 Z" fill="#1e293b" stroke="url(#catGrad)" stroke-width="2"/>
  <!-- Cat Eyes (Glowing Meme Eyes) -->
  <ellipse cx="25" cy="34" rx="4" ry="5" fill="#22d3ee"/>
  <ellipse cx="39" cy="34" rx="4" ry="5" fill="#22d3ee"/>
  <circle cx="26" cy="33" r="1.5" fill="#ffffff"/>
  <circle cx="40" cy="33" r="1.5" fill="#ffffff"/>
  <!-- Nose & Mouth -->
  <polygon points="32,40 30,38 34,38" fill="#f472b6"/>
  <path d="M30,41 Q32,43 34,41" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Whiskers -->
  <line x1="14" y1="36" x2="22" y2="38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="41" x2="22" y2="41" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="42" y2="38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="51" y1="41" x2="42" y2="41" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
